<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CodePipeline Demo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            overflow:hidden;
        }

        .container{
            text-align:center;
            padding:50px;
            border-radius:20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
            width:80%;
            max-width:900px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1{
            font-size:4rem;
            margin-bottom:20px;
            text-transform:uppercase;
            letter-spacing:3px;
            background: linear-gradient(to right,#ffffff,#38bdf8,#93c5fd);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation: glow 2s infinite alternate;
        }

        h2{
            font-size:2rem;
            margin-bottom:25px;
            color:#e0f2fe;
        }

        p{
            font-size:1.2rem;
            line-height:1.8;
            color:#dbeafe;
            margin-bottom:30px;
        }

        .pipeline{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:20px;
            flex-wrap:wrap;
            margin-top:20px;
        }

        .stage{
            background:#1e40af;
            padding:20px 30px;
            border-radius:15px;
            font-weight:bold;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
            transition:0.3s;
        }

        .stage:hover{
            transform:scale(1.1);
            background:#2563eb;
        }

        .arrow{
            font-size:2rem;
            color:white;
        }

        .footer{
            margin-top:40px;
            font-size:1rem;
            color:#bfdbfe;
        }

        @keyframes glow{
            from{
                text-shadow:0 0 10px #38bdf8;
            }
            to{
                text-shadow:0 0 25px #93c5fd;
            }
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AWS CodePipeline</h1>

        <h2>CI/CD Pipeline Successfully Deployed 🚀</h2>

        <p>
            This application is deployed automatically using
            AWS CodePipeline and CodeDeploy.
            Every GitHub push triggers a fully automated deployment workflow.
        </p>

        <div class="pipeline">

            <div class="stage">GitHub</div>

            <div class="arrow">➜</div>

            <div class="stage">CodePipeline</div>

            <div class="arrow">➜</div>

            <div class="stage">CodeDeploy</div>

            <div class="arrow">➜</div>

            <div class="stage">EC2 Deployment</div>

        </div>

        <div class="footer">
            Powered by AWS DevOps Services ☁️
        </div>

    </div>

</body>
</html>
