<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saurabh CodePipeline</title>
    <style>
        :root {
            --bg-dark: #070a13;
            --pipeline-blue: #00f2fe;
            --pipeline-purple: #4facfe;
            --text-light: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1f36 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Decorative glowing orbs in the background */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            background: var(--pipeline-blue);
            top: -10%;
            left: 10%;
            animation: float 12s infinite alternate ease-in-out;
        }
        .orb-2 {
            background: var(--pipeline-purple);
            bottom: -10%;
            right: 10%;
            animation: float 12s infinite alternate-reverse ease-in-out;
        }

        /* Glassmorphism Container */
        .container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 4rem 3rem;
            border-radius: 28px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* AWS CodePipeline Visual Element */
        .pipeline-status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--pipeline-blue);
            margin-bottom: 2.5rem;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--pipeline-blue);
            border-radius: 50%;
            position: relative;
        }

        .status-dot::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--pipeline-blue);
            border-radius: 50%;
            animation: ripple 1.5s infinite ease-out;
        }

        /* Heading Style */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .highlight {
            background: linear-gradient(90deg, var(--pipeline-blue), var(--pipeline-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        /* Message subtitle */
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        /* Tech Footer Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin-bottom: 1.5rem;
        }

        .meta {
            font-size: 0.8rem;
            color: #64748b;
            font-family: monospace;
        }

        /* Animations */
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .container { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="pipeline-status">
            <span class="status-dot"></span>
            Deployment Successful
        </div>
        
        <h1>Hello From <span class="highlight">Saurabh CodePipeline!</span></h1>
        
        <p>Continuous Integration & Continuous Deployment lifecycle completed successfully. This stack is fully automated and live.</p>
        
        <div class="divider"></div>
        <div class="meta">AWS • EC2 • CodeDeploy • GitHub</div>
    </div>

</body>
</html>
