<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeDeploy Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent-start: #38bdf8;
            --accent-end: #818cf8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Subtle background grid pattern */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .card {
            background-color: var(--card-bg);
            padding: 3.5rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 
                        0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(8px);
            animation: fadeInUp 0.8s ease-out;
        }

        /* Fancy Gradient Text */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        /* Pulse Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-start);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-start);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            animation: pulse 1.6s infinite;
        }

        /* Action Button */
        .btn {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: #ffffff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(56, 189, 248, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            Pipeline Ready
        </div>
        <h1>Hello Guyz Lets do the codedeploy</h1>
        <p class="subtitle">Your automated AWS deployment infrastructure is live and listening.</p>
        <button class="btn" onclick="alert('Deployment sequence initiated! 🚀')">Trigger Deploy</button>
    </div>

</body>
</html>
